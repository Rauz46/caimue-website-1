name: Vercel Deploy (dev / staging)

# Pushes to `dev` and `staging` build, lint, and deploy to Vercel.
# `main` is intentionally NOT handled here — production stays on Vercel's
# native Git integration so www.caimue.com is never touched by CI.
#
# IMPORTANT: If you keep this workflow, disable Vercel's automatic
# deployments for the dev/staging branches (see the walkthrough / vercel.json),
# otherwise every push deploys twice (once via CI, once via Vercel's Git hook).

on:
  push:
    branches:
      - dev
      - staging

# Cancel an in-flight run if a newer commit lands on the same branch.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Non-blocking: there are pre-existing lint findings that don't block
      # the Vercel build, so we surface them but never fail the deploy on them.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      # Both dev and staging are Vercel "preview" deployments. The custom
      # domains (dev.caimue.com / staging.caimue.com) are pinned to each branch
      # in the Vercel dashboard, so the matching domain auto-aliases to the
      # latest deployment of that branch.
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      # Retry with backoff: Vercel occasionally rejects artifact uploads
      # ("Upload aborted") during platform degradation; a later attempt
      # usually lands once their intake recovers.
      - name: Deploy to Vercel (preview)
        run: |
          for i in 1 2 3 4 5; do
            if vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}; then
              exit 0
            fi
            echo "Deploy attempt $i failed; waiting 90s before retry..."
            sleep 90
          done
          echo "All deploy attempts failed."
          exit 1
